<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="bt bd">
  <title id="bt">Beautiful Go — architecture</title>
  <desc id="bd">Clients reach a chi composition root wired with google/wire; feature slices (auth, widgets, realtime) are six-file vertical slices whose use cases call consumer-defined ports; adapters beneath the slices (pgx + sqlc, go-redis on Dragonfly, River jobs, authx) satisfy those ports. The pure domain is protected by four non-waivable depguard rules, and CI runs the checker, lints harness, examples, and unittest gates.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .t{fill:#00ADD8;font-size:20px;font-weight:700}
    .sub{fill:#94A3B8;font-size:12px}
    .ring{fill:#94A3B8;font-size:11px;letter-spacing:1.5px;font-weight:600}
    .c{fill:#131B2E;stroke:#1E293B}
    .dom{fill:#00ADD8;fill-opacity:0.16;stroke:#1E293B}
    .gp{fill:#131B2E;stroke:#1E293B;stroke-dasharray:4 3}
    .ct{fill:#E2E8F0;font-size:13px;font-weight:600}
    .ct12{fill:#E2E8F0;font-size:12px;font-weight:600}
    .cs{fill:#94A3B8;font-size:11.5px}
    .pill{fill:#0B1020;stroke:#00ADD8}
    .pt{fill:#00ADD8;font-size:11px;font-weight:600}
    .chip{fill:#0F172A;stroke:#1E293B}
    .chipT{fill:#94A3B8;font-size:11px}
    .arrow{stroke:#94A3B8;stroke-width:1.5}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="1078" height="558" rx="14" fill="#0B1020" stroke="#1E293B"/>

  <!-- title -->
  <text x="540" y="40" text-anchor="middle" class="t">Beautiful Go — architecture</text>
  <text x="540" y="62" text-anchor="middle" class="sub">the facta backend-go stack · chi · pgx/v5 + sqlc · google/wire · River · go-redis · enforced by depguard in CI</text>

  <!-- ring headers -->
  <text x="78"   y="95" text-anchor="middle" class="ring">CLIENTS</text>
  <text x="236"  y="95" text-anchor="middle" class="ring">COMPOSITION</text>
  <text x="472"  y="95" text-anchor="middle" class="ring">SLICES</text>
  <text x="700"  y="95" text-anchor="middle" class="ring">PORTS</text>
  <text x="928"  y="95" text-anchor="middle" class="ring">DOMAIN</text>

  <!-- clients -->
  <rect x="30" y="104" width="96" height="96" rx="8" class="c"/>
  <text x="78" y="134" text-anchor="middle" class="ct12">HTTP · WS · SSE</text>
  <text x="78" y="156" text-anchor="middle" class="cs">CLI · services</text>

  <!-- composition root -->
  <rect x="162" y="104" width="148" height="96" rx="8" class="c"/>
  <text x="236" y="130" text-anchor="middle" class="ct12">cmd/api · cmd/worker</text>
  <text x="236" y="150" text-anchor="middle" class="cs">google/wire · chi</text>
  <text x="236" y="170" text-anchor="middle" class="cs">config · otelhttp</text>

  <!-- slices -->
  <rect x="350" y="104" width="244" height="48" rx="8" class="c"/>
  <text x="472" y="124" text-anchor="middle" class="ct">auth</text>
  <text x="472" y="142" text-anchor="middle" class="cs">signup · session · password</text>
  <rect x="350" y="156" width="244" height="48" rx="8" class="c"/>
  <text x="472" y="176" text-anchor="middle" class="ct">widgets · realtime</text>
  <text x="472" y="194" text-anchor="middle" class="cs">six files · http.go · module.go</text>

  <!-- ports -->
  <rect x="630" y="104" width="140" height="96" rx="8" class="c"/>
  <text x="700" y="134" text-anchor="middle" class="ct">ports.go</text>
  <text x="700" y="156" text-anchor="middle" class="cs">consumer-defined</text>
  <text x="700" y="176" text-anchor="middle" class="cs">1–2 methods · fakes</text>

  <!-- domain (accented) -->
  <rect x="806" y="104" width="244" height="96" rx="8" class="dom"/>
  <text x="928" y="134" text-anchor="middle" class="ct">domain.go — pure, I/O-free</text>
  <text x="928" y="156" text-anchor="middle" class="cs">stdlib + internal/shared</text>
  <text x="928" y="176" text-anchor="middle" class="cs">sentinels · errors.Is/As</text>

  <!-- arrows -->
  <line x1="126" y1="152" x2="156" y2="152" class="arrow" marker-end="url(#ah)"/>
  <line x1="310" y1="152" x2="344" y2="152" class="arrow" marker-end="url(#ah)"/>
  <line x1="594" y1="152" x2="624" y2="152" class="arrow" marker-end="url(#ah)"/>
  <line x1="770" y1="152" x2="800" y2="152" class="arrow" marker-end="url(#ah)"/>

  <!-- gate pills on ring boundaries -->
  <rect x="244" y="256" width="172" height="26" rx="13" class="pill"/>
  <text x="330" y="273" text-anchor="middle" class="pt">depguard · slice-isolation</text>
  <rect x="505" y="256" width="214" height="26" rx="13" class="pill"/>
  <text x="612" y="273" text-anchor="middle" class="pt">depguard · usecase-transport-free</text>
  <rect x="709" y="256" width="148" height="26" rx="13" class="pill"/>
  <text x="783" y="273" text-anchor="middle" class="pt">depguard · domain-pure</text>
  <rect x="862" y="256" width="176" height="26" rx="13" class="pill"/>
  <text x="950" y="273" text-anchor="middle" class="pt">CONTRACTS NON-WAIVABLE</text>

  <!-- adapters row -->
  <rect x="338" y="300" width="712" height="98" rx="10" class="gp"/>
  <text x="348" y="316" class="ring">ADAPTERS — platform/ + per-slice</text>
  <rect x="799" y="287" width="202" height="26" rx="13" class="pill"/>
  <text x="900" y="304" text-anchor="middle" class="pt">depguard · platform-no-features</text>

  <rect x="350" y="322" width="164" height="62" rx="8" class="c"/>
  <text x="432" y="344" text-anchor="middle" class="ct12">postgres.go</text>
  <text x="432" y="364" text-anchor="middle" class="cs">pgx/v5 pool → sqlc gen/db</text>

  <rect x="528" y="322" width="164" height="62" rx="8" class="c"/>
  <text x="610" y="344" text-anchor="middle" class="ct12">platform/redis</text>
  <text x="610" y="364" text-anchor="middle" class="cs">go-redis · Dragonfly</text>

  <rect x="706" y="322" width="164" height="62" rx="8" class="c"/>
  <text x="788" y="344" text-anchor="middle" class="ct12">platform/email</text>
  <text x="788" y="364" text-anchor="middle" class="cs">River · AddTx same tx</text>

  <rect x="884" y="322" width="164" height="62" rx="8" class="c"/>
  <text x="966" y="344" text-anchor="middle" class="ct12">platform/authx</text>
  <text x="966" y="364" text-anchor="middle" class="cs">JWT HS256 · bcrypt+pepper</text>

  <!-- remaining mandated libs -->
  <text x="540" y="436" text-anchor="middle" class="cs">go-playground/validator at http.go DTOs · slog JSON handler + request_id · OpenTelemetry otelhttp at the chain head · Prometheus /metrics</text>
  <text x="540" y="454" text-anchor="middle" class="cs">golang-migrate as a deploy step, never at startup · PgBouncer in transaction mode in front of pgxpool · Docker images on Kubernetes</text>

  <!-- CI gates -->
  <text x="30" y="499" class="ring">CI GATES</text>
  <rect x="130" y="480" width="120" height="28" rx="14" class="chip"/>
  <text x="190" y="498" text-anchor="middle" class="chipT">check-skill.py</text>
  <rect x="262" y="480" width="120" height="28" rx="14" class="chip"/>
  <text x="322" y="498" text-anchor="middle" class="chipT">check-lints.sh</text>
  <rect x="394" y="480" width="136" height="28" rx="14" class="chip"/>
  <text x="462" y="498" text-anchor="middle" class="chipT">check-examples.py</text>
  <rect x="542" y="480" width="168" height="28" rx="14" class="chip"/>
  <text x="626" y="498" text-anchor="middle" class="chipT">unittest discover tests</text>
  <text x="730" y="498" class="chipT">depguard violations fail the gate — fix the shape, never nolint it away</text>
</svg>